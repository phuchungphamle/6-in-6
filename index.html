<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5ef">
    <title>6 in 6 — Reading challenge</title>
    <link rel="stylesheet" href="styles.css">
    <script src="catalog.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="6 in 6 home">
        <span class="brand-mark">6<span>×</span>6</span>
        <span class="brand-name">READING<br>CHALLENGE</span>
      </a>
      <div class="topbar-right">
        <span class="local-badge"><span class="status-dot"></span> READING CHALLENGE</span>
        <button class="avatar-button" id="profile-button" type="button" aria-label="Open profile">?</button>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <p class="side-label">YOUR SPACE</p>
        <button class="nav-link active" data-view="discover" type="button"><span class="nav-icon">⌕</span> Discover books</button>
        <button class="nav-link" data-view="challenge" type="button"><span class="nav-icon">◷</span> My challenge <span class="nav-count" id="nav-progress">0/6</span></button>
        <button class="nav-link" data-view="leaderboard" type="button"><span class="nav-icon">↗</span> Leaderboard</button>
        <div class="sidebar-rule"></div>
        <p class="side-label">FOR TEACHERS</p>
        <button class="nav-link" data-view="review" type="button"><span class="nav-icon">⌑</span> <span id="teacher-nav-label">Teacher sign in</span> <span class="nav-count" id="pending-count">0</span></button>
        <div class="sidebar-note"><span class="note-icon">i</span><p>Every review is checked by a teacher before it counts toward a challenge or the leaderboard.</p></div>
        <div class="profile-card" id="sidebar-profile"></div>
      </aside>

      <main id="main-content" tabindex="-1"></main>
    </div>
    <div class="password-overlay" id="teacher-dialog" hidden>
      <section class="password-dialog" role="dialog" aria-modal="true" aria-labelledby="teacher-dialog-title">
      <form id="teacher-login-form">
        <span class="eyebrow">TEACHER ACCESS</span>
        <h2 id="teacher-dialog-title">Teacher sign in</h2>
        <p>Enter the password to review student submissions.</p>
        <label class="form-label" for="teacher-password">Password</label>
        <input class="text-input" id="teacher-password" type="password" autocomplete="current-password" required>
        <p class="password-error" id="teacher-password-error" role="alert"></p>
        <div class="dialog-actions">
          <button class="button secondary" id="teacher-cancel" type="button">Cancel</button>
          <button class="button" type="submit">Continue</button>
        </div>
      </form>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
